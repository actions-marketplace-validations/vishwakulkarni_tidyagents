<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 262" width="768" height="262" role="img" aria-label="What tidyagents finds in 67 popular repos">
<title>What tidyagents finds in 67 popular repos</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t1 { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .t2 { fill: #52514e; font-size: 13px; }
  .lab { fill: #0b0b0b; font-size: 13px; }
  .val { fill: #0b0b0b; font-size: 13px; font-weight: 600; }
  .ax { fill: #52514e; font-size: 12px; }
  .grid { stroke: #e1e0d9; stroke-width: 1; }
  .base { stroke: #898781; stroke-width: 1; }
  .ok { fill: #2a78d6; } .bad { fill: #eb6834; } .neutral { fill: #898781; }
  .okS { stroke: #2a78d6; } .badS { stroke: #eb6834; } .ring { stroke: #fcfcfb; }
  .link { stroke: #898781; stroke-width: 2; }
