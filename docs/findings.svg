<rect class="bg" width="768" height="262" rx="12"/>
<g transform="translate(24,20)">
<text class="t1" x="0" y="22">What tidyagents finds in 67 popular repos</text>
<text class="t2" x="0" y="44">Repos with 300+ stars and an AGENTS.md, CLAUDE.md, GEMINI.md, SKILL.md or .cursorrules.</text>
