<text class="lab" x="0" y="200">vuepress-theme-plume</text><text class="ax" x="0" y="216">AGENTS.md</text><line class="link" x1="611.2" x2="653.2" y1="202" y2="202"/><circle class="neutral ring" cx="611.2" cy="202" r="7" stroke-width="2"/><circle class="ok ring" cx="653.2" cy="202" r="7" stroke-width="2"/><text class="ax" x="599.2" y="206" text-anchor="end">86</text><text class="val" x="665.2" y="206">96</text>
