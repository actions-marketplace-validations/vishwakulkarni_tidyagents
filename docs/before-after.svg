<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 316" width="768" height="316" role="img" aria-label="tidyagents score before and after the fix in three public repos">
<title>tidyagents score before and after the fix in three public repos</title>
<style>
  svg { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  .t1 { fill: #0b0b0b; font-size: 17px; font-weight: 600; }
  .t2 { fill: #52514e; font-size: 13px; }
  .lab { fill: #0b0b0b; font-size: 13px; }
