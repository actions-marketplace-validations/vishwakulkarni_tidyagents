  .base { stroke: #898781; stroke-width: 1; }
  .ok { fill: #2a78d6; } .bad { fill: #eb6834; } .neutral { fill: #898781; }
  .okS { stroke: #2a78d6; } .badS { stroke: #eb6834; } .ring { stroke: #fcfcfb; }
  .link { stroke: #898781; stroke-width: 2; }
